name: Build Fedora Emacs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:45

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc make autoconf automake libtool pkgconfig texinfo \
            ncurses-devel gnutls-devel libxml2-devel jansson-devel \
            pcre2-devel sqlite-devel zlib-devel libcap-devel \
            libffi-devel xz-devel libidn2-devel libtasn1-devel \
            nettle-devel libunistring-devel libgpg-error-devel \
            libgcrypt-devel openssl-devel git wget file

      - name: Clone Emacs source
        run: |
          git clone --depth 1 --branch master https://github.com/emacs-mirror/emacs.git emacs-src

      - name: Configure and build dynamic Emacs
        working-directory: emacs-src
        run: |
          ./autogen.sh
          autoreconf -fi
          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host=x86_64-pc-linux-gnu \
            --prefix=$HOME/.local \
            --without-x \
            --without-xpm \
            --without-jpeg \
            --without-png \
            --without-gif \
            --without-tiff \
            --without-toolkit-scroll-bars \
            --without-x-toolkit \
            --with-x-toolkit=no \
            --without-gsettings \
            --without-dbus \
            --without-gconf \
            --without-selinux \
            --without-sound \
            --without-imagemagick \
            --without-xwidgets \
            --with-gnutls \
            --without-modules \
            --without-compress-install \
            --without-native-compilation \
            --without-lcms2 \
            --with-pdumper=yes \
            CFLAGS="-O2 -g -fno-omit-frame-pointer"
          make bootstrap -j$(nproc)
          make -j$(nproc)
          
          # Create version-specific libexec directory and dump the portable file
          mkdir -p $HOME/.local/libexec/emacs/$EMACS_VERSION/x86_64-pc-linux-gnu
          src/temacs -Q --batch --eval "(dump-emacs-portable \"$HOME/.local/libexec/emacs/$EMACS_VERSION/x86_64-pc-linux-gnu/emacs.pdmp\")"

          make install

      - name: Verify the built binary
        run: |
          $HOME/.local/bin/emacs --version
          echo "=== NEEDED libraries ==="
          readelf -d $HOME/.local/bin/emacs | grep NEEDED
          echo "=== libxml2 linkage ==="
          ldd $HOME/.local/bin/emacs | grep -i xml || true
          # fail the job if it still wants the old soname
          if readelf -d $HOME/.local/bin/emacs | grep -q 'libxml2.so.2'; then
            echo "ERROR: binary linked against old libxml2.so.2" >&2
            exit 1
          fi

      - name: Prepare artifact directory
        run: |
          mkdir -p artifact/bin
          cp -r $HOME/.local/bin/* artifact/bin/
          cp -r $HOME/.local/lib artifact/lib || true
          cp -r $HOME/.local/libexec artifact/libexec || true
          cp -r $HOME/.local/share artifact/share || true

      - name: Upload dynamic Emacs artifact
        uses: actions/upload-artifact@v7
        with:
          name: emacs-dynamic-binary
          path: artifact/
          retention-days: 14
          compression-level: 6
